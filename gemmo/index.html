<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gemmotherapie Knospen</title>
<meta name="robots" content="noindex,nofollow">

<!--
  Privates Nachschlagewerk zum Kartenset »Gemmotherapie« von Chrischta Ganz
  und Louis Hutter. Abschrift fuer den eigenen Gebrauch, nicht zur
  Veroeffentlichung.

  KEINE Schrift von aussen, keine Bibliothek, kein Build. Das Ding muss im
  Flugzeug, im Keller und im Wald funktionieren — also nur Systemschriften und
  alles, was es braucht, in drei Dateien: diese, karten.js, und die Bilder
  daneben.

  DIE KARTE IST DAS OBJEKT. Nicht eine Seite mit Abschnitten, sondern ein
  Stueck Papier mit zwei Seiten, das man umdreht. Papierton, die eingerueckte
  olivgruene Linie, Knospe und Namen unten links vorne, gruene Versalien und
  laufender Text hinten. Wer die App kennt, findet sich im Stapel zurecht und
  umgekehrt. Auch die Kacheln im Menue sind Karten — das Menue ist eine Hand.

  VIER WEGE, vom Startbildschirm aus gewaehlt, weil es vier verschiedene
  Absichten gibt:
    Karten   — durchblaettern, nichts wollen
    Lernen   — im Vollbild, Vorderseite raten, umdrehen, selbst bewerten
    Suchen   — vom Symptom zur Knospe
    Pruefung — sich abfragen lassen, mit Punkten und Bestwert
  Lernen und Pruefung sind nicht dasselbe: beim Lernen bewertet man sich
  selbst und darf grosszuegig sein, in der Pruefung entscheidet die Antwort.
-->

<style>
:root{
  /* --- Die App drumherum --- */
  --papier:#faf7f0;
  --tinte:#2b2f26;
  --tinte-still:#6d7166;
  --gruen:#5c7a33;
  --gruen-hell:#7d9c50;
  --linie:#e2ddd0;
  --linie-stark:#cdc6b4;
  --fehlt:#a8552f;
  --richtig:#4b7a2e;
  --falsch:#a8442a;

  /* --- Die Karte selbst ---
     Eigene Farben, absichtlich vom Rest der App getrennt: die Karte ist ein
     Gegenstand aus Papier und behaelt ihre Farben, egal wie die App gerade
     aussieht. Das Gruen ist gegenueber dem Druck eine Spur dunkler gesetzt.
     Der Originalton (rund #7f9f38) kommt auf dem hellen Papier nur auf 3.4:1
     und ist in den kleinen Versalien schwer zu lesen; #64802d liegt bei 4.9:1
     und ist danebengehalten nicht zu unterscheiden. */
  --k-papier:#fbfaf6;
  --k-tinte:#23262a;
  --k-tinte-still:#5d6169;
  --k-gruen:#64802d;
  --k-warn:#9d4a22;
  --k-rand:#a9bd80;
  --k-schatten:0 1px 2px rgba(40,45,30,.10),0 18px 40px -22px rgba(40,45,30,.45);
  /* Schrift auf dem gefuellten Knopf. Als eigener Wert und nicht in der
     Medienabfrage: eine Farbe, die nur dort steht, gilt ausserhalb nicht. */
  --knopf-schrift:#faf7f0;

  --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spalte:min(940px,calc(100% - 2 * clamp(16px,4vw,40px)));
}
@media(prefers-color-scheme:dark){
  :root{
    --papier:#191b17;
    --tinte:#e6e4da;
    --tinte-still:#9b9d92;
    --gruen:#9cbd68;
    --gruen-hell:#b3d183;
    --linie:#32362d;
    --linie-stark:#454a3d;
    --fehlt:#e0956e;
    --richtig:#9ccb6c;
    --falsch:#e58b64;
    /* Die Karte bleibt Papier, wird aber vom Weiss zurueckgenommen: eine
       reinweisse Flaeche auf fast schwarzem Grund blendet nachts. Die Tinte
       wandert mit, damit der Kontrast innerhalb der Karte gleich bleibt. */
    --k-papier:#e9e6db;
    --k-tinte:#20231f;
    --k-tinte-still:#575b52;
    --k-gruen:#5c7729;
    --k-warn:#8e4220;
    --k-rand:#9cb073;
    --k-schatten:0 1px 2px rgba(0,0,0,.5),0 18px 44px -20px rgba(0,0,0,.8);
    --knopf-schrift:#171a14;
  }
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--papier)}
body{
  background:var(--papier);color:var(--tinte);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  /* clip statt hidden: hidden machte den Body zum eigenen Scroll-Container. */
  overflow-x:hidden;
  overflow-x:clip;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gruen);outline-offset:2px;border-radius:3px}
/* Die Buehne wird nach jedem Wechsel fokussiert, damit Screenreader den neuen
   Inhalt ansagen. Ein Rahmen um die ganze Seite waere dabei nur Laerm. */
#buehne:focus{outline:none}
.spalte{width:var(--spalte);margin-inline:auto;padding-bottom:4rem}

/* ---------- Knoepfe ---------- */

.knopf{
  padding:.62rem 1.15rem;border-radius:9px;font-size:.92rem;
  border:1px solid var(--linie-stark);background:transparent;
}
.knopf:hover{border-color:var(--gruen);color:var(--gruen)}
.knopf-haupt{
  background:var(--gruen);border-color:var(--gruen);
  color:var(--knopf-schrift);font-weight:600;
}
.knopf-haupt:hover{background:var(--gruen-hell);border-color:var(--gruen-hell)}
.knopfreihe{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}

/* ---------- Kopfleiste ----------
   Schmal und immer gleich: links zurueck, rechts der Name des Ortes. Auf dem
   Startbildschirm gibt es sie nicht — dort ist man ja schon zuhause. */

.kopf{
  position:sticky;top:0;z-index:10;background:var(--papier);
  border-bottom:1px solid var(--linie);
}
.kopf .spalte{
  display:flex;align-items:center;gap:.8rem;
  padding-block:.55rem;padding-bottom:.55rem;
}
.zurueck{
  font-size:.9rem;color:var(--tinte-still);
  padding:.35rem .5rem .35rem 0;margin-left:-.15rem;
}
.zurueck:hover{color:var(--gruen)}
.ortsname{
  font-family:var(--serif);font-size:1.02rem;
  margin-left:auto;color:var(--tinte-still);
}

/* ---------- Startbildschirm ----------
   Vier Kacheln in der Anmutung der Kartenrueckseiten: dasselbe Papier,
   dieselbe eingerueckte Linie. Das Menue ist eine Hand Karten, kein
   Knopfbrett. */

.start{
  min-height:calc(100dvh - 4rem);
  display:flex;flex-direction:column;justify-content:center;
  padding:2.5rem 0 1rem;gap:2rem;
}
.wappen{text-align:center}
.wappen h1{
  font-family:var(--serif);font-weight:400;line-height:1.05;
  font-size:clamp(2.4rem,11vw,3.6rem);letter-spacing:-.015em;
}
.wappen .zweitzeile{
  display:block;font-style:italic;color:var(--gruen);
  font-size:clamp(1.05rem,4.4vw,1.35rem);margin-top:.45rem;
}
.wappen .stand{
  display:block;margin-top:1rem;font-family:var(--sans);
  font-size:.8rem;color:var(--tinte-still);font-variant-numeric:tabular-nums;
}

.wege{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.weg{
  display:flex;flex-direction:column;text-align:left;
  background:var(--k-papier);color:var(--k-tinte);
  border-radius:13px;box-shadow:var(--k-schatten);padding:8px;
  transition:transform .14s;
}
.weg:hover{transform:translateY(-3px) rotate(-.4deg)}
.weg-rand{
  border:1px solid var(--k-rand);border-radius:8px;
  padding:1.05rem 1rem 1rem;height:100%;
  display:flex;flex-direction:column;gap:.28rem;
}
.weg .marke{
  width:27px;height:27px;fill:none;stroke:var(--k-gruen);
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
}
.weg .name{font-family:var(--serif);font-size:1.28rem;line-height:1.2;margin-top:.3rem}
.weg .satz{font-size:.83rem;color:var(--k-tinte-still);line-height:1.35}
.weg .marke-zahl{
  margin-top:auto;padding-top:.7rem;font-size:.76rem;color:var(--k-gruen);
  font-variant-numeric:tabular-nums;
}

/* ---------- Das Kartenbild ----------
   Ein Blatt Papier mit einer eingerueckten Linie. Beide Seiten liegen in
   derselben Rasterzelle uebereinander, damit die Karte so hoch wird wie ihre
   laengere Seite — auf echtem Karton ist die Vorderseite ja auch nicht
   kuerzer als die Rueckseite, sie hat nur mehr Luft. */

.blatt{perspective:1800px;width:100%;max-width:29rem;margin-inline:auto;cursor:pointer}
.dreh{
  display:grid;position:relative;
  transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.2,.72,.18,1);
}
.blatt[data-gedreht="true"] .dreh{transform:rotateY(180deg)}
@media(prefers-reduced-motion:reduce){.dreh{transition:none}}

/* Haelt das Kartenformat, solange die Rueckseite kuerzer ist als hoch — sonst
   waere eine Karte mit drei Indikationen ein Zettel. Wird der Text laenger,
   waechst die Karte darueber hinaus. */
.mass{grid-area:1/1;aspect-ratio:1 / 1.5;visibility:hidden;pointer-events:none;min-width:0}

.seite{
  grid-area:1/1;
  /* Rasterzellen bekommen von sich aus eine Mindestbreite in Groesse ihres
     Inhalts und schieben sich dann ueber die Spalte hinaus. Ohne diese Zeile
     ragt die Karte auf dem Telefon rechts aus dem Bild. */
  min-width:0;
  background:var(--k-papier);color:var(--k-tinte);
  border-radius:16px;box-shadow:var(--k-schatten);
  padding:clamp(11px,2.6vw,15px);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  /* Ohne die eigene Drehung blitzt in WebKit beim Wenden die Rueckseite durch. */
  transform:rotateY(0deg);
}
.hinten{transform:rotateY(180deg)}
.seite[inert]{pointer-events:none}

/* Die duenne olivgruene Linie sitzt nicht am Kartenrand, sondern ein Stueck
   innen — das ist das Erkennungszeichen dieses Sets. */
.rand{
  border:1px solid var(--k-rand);border-radius:9px;
  height:100%;padding:clamp(15px,4vw,26px);
  display:flex;flex-direction:column;
}

/* --- Vorderseite: Knospe oben, Namen unten links --- */

.knospe-feld{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.knospe-feld img{max-height:100%;width:auto;object-fit:contain}
.knospe-leer{
  width:100%;max-width:14rem;aspect-ratio:4/3;
  border:1px dashed var(--k-rand);border-radius:6px;
  display:grid;place-items:center;padding:1rem;text-align:center;
  color:var(--k-tinte-still);font-size:.78rem;
}
/* Dasselbe Feld, aber es nimmt eine Aufnahme entgegen. Der gestrichelte Rahmen
   bleibt — er sagt schon »hier fehlt etwas«, und ein Knopf daraus zu machen
   heisst nur, dass man ihn antippen darf. */
.knospe-aufnehmen{cursor:pointer;color:var(--k-gruen);line-height:1.4}
.knospe-aufnehmen:hover{border-color:var(--k-gruen);border-style:solid}
.knospe-aufnehmen .klein{display:block;color:var(--k-tinte-still);font-size:.72rem;margin-top:.3em}
.bildzeile{
  max-width:29rem;margin:.7rem auto 0;text-align:center;
  font-size:.8rem;color:var(--tinte-still);
}
.bildzeile button{text-decoration:underline;padding:.2rem .35rem}
.bildzeile button:hover{color:var(--gruen)}
.namen{margin-top:clamp(14px,3vw,22px)}
.namen .lat{
  display:block;font-family:var(--serif);font-style:italic;
  font-size:clamp(1.05rem,3.4vw,1.28rem);line-height:1.25;
}
.namen .de{
  display:block;font-family:var(--serif);
  font-size:clamp(1.18rem,3.9vw,1.45rem);line-height:1.25;
}
.namen .unter{
  display:block;margin-top:.85em;
  font-family:var(--serif);font-style:italic;color:var(--k-gruen);
  font-size:clamp(1rem,3.2vw,1.16rem);line-height:1.35;
}
.namen .unter.offen{
  color:var(--k-warn);font-style:normal;font-family:var(--sans);font-size:.85rem;
}

/* --- Rueckseite --- */

.reihe{
  font-family:var(--serif);font-size:clamp(1.14rem,3.6vw,1.34rem);
  line-height:1.2;margin-bottom:.85em;
}
.abschnitt{margin-top:1em}
.abschnitt:first-of-type{margin-top:0}
.abschnitt h2{
  font-size:.76rem;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
  color:var(--k-gruen);margin-bottom:.15em;
}
.abschnitt p,.abschnitt li{font-size:clamp(.88rem,2.7vw,.95rem);line-height:1.38}
.offen{color:var(--k-warn);font-size:.85rem}

/* Warnsatz aus den seelischen Aspekten. Kein Kasten, kein Symbol — der Satz
   steht wortgetreu an seiner Stelle und wird nur farbig abgesetzt. */
.vorsicht{color:var(--k-warn);margin-top:.35em}

/* Ein <button> ist im Browser ein atomarer Inline-Kasten: er bricht nur
   zwischen zwei Eintraegen um, nie innerhalb. »Lungen-, Knochen- und
   Knochenhautentzündung« bekaeme so eine eigene Zeile und der Schlusspunkt
   noch eine. display:inline hilft nicht, Formularelemente ignorieren das.
   Deshalb sind die klickbaren Woerter hier <span role="button"> — die laufen
   im Text mit und brechen wie jedes andere Wort. */
.verweis{cursor:pointer;border-bottom:1px solid transparent}
.verweis:hover{border-bottom-color:var(--k-gruen);color:var(--k-gruen)}

.kombis{list-style:none;margin-top:.15em}
.kombis li{padding-left:1.05em;text-indent:-1.05em;margin-top:.3em}
.kombis li::before{content:"+ ";color:var(--k-gruen);font-weight:700}
.kombis .partner,.kombis .tot{font-family:var(--serif);font-style:italic}
.kombis .partner{border-bottom-color:var(--k-rand)}
.kombis .tot{color:var(--k-tinte-still)}
.kombis .plus{color:var(--k-gruen);font-weight:700;white-space:pre}
.kombis .verbindung{white-space:pre}

.karte-quelle{
  margin-top:auto;padding-top:1.1em;
  font-size:clamp(.6rem,1.9vw,.68rem);color:var(--k-tinte-still);line-height:1.3;
}

.karte-knoepfe{max-width:29rem;margin:1.1rem auto 0}
.nachsatz{
  max-width:29rem;margin:1.2rem auto 0;text-align:center;
  font-size:.76rem;color:var(--tinte-still);
}

/* ---------- Der Stapel ---------- */

.gitter{
  display:grid;gap:.9rem;margin-top:1.3rem;
  grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
}
.eintrag{
  display:flex;flex-direction:column;text-align:left;width:100%;
  background:var(--k-papier);color:var(--k-tinte);
  border-radius:11px;box-shadow:var(--k-schatten);padding:8px;
  min-height:15rem;transition:transform .14s;
}
.eintrag:hover{transform:translateY(-3px) rotate(-.4deg)}
.eintrag .rand{padding:.8rem .85rem;border-radius:6px}
.eintrag .knospe-feld{min-height:3.5rem}
.eintrag .knospe-leer{
  max-width:none;aspect-ratio:auto;height:100%;width:100%;
  border-radius:4px;font-size:.68rem;padding:.5rem;
}
.eintrag .namen{margin-top:.7rem}
.eintrag .namen .lat{font-size:.95rem}
.eintrag .namen .de{font-size:1.02rem}
.eintrag .namen .unter{font-size:.8rem;margin-top:.45em}
.eintrag .treffer{margin-top:.5rem;font-size:.76rem;color:var(--k-gruen);line-height:1.3}
.eintrag .luecke{margin-top:.5rem;font-size:.72rem;color:var(--k-warn)}

.leer{margin-top:2rem;color:var(--tinte-still)}

/* ---------- Suchen ---------- */

.suchzeile{display:flex;gap:.5rem;margin-top:1.2rem}
.suche{
  flex:1;min-width:0;font:inherit;font-size:1.05rem;
  color:var(--tinte);background:transparent;
  border:1px solid var(--linie-stark);border-radius:9px;padding:.7rem .85rem;
}
.suche::placeholder{color:var(--tinte-still)}
.suchhinweis{margin-top:.6rem;font-size:.82rem;color:var(--tinte-still)}
.trennung{
  margin-top:2.4rem;padding-bottom:.3rem;border-bottom:1px solid var(--linie);
  font-size:.76rem;font-weight:700;letter-spacing:.075em;text-transform:uppercase;
  color:var(--tinte-still);
}
.register{display:grid;gap:.1rem}
.register-zeile{
  display:grid;grid-template-columns:minmax(0,1fr);gap:.15rem;
  padding:.6rem 0;border-bottom:1px solid var(--linie);
}
@media(min-width:620px){
  .register-zeile{grid-template-columns:minmax(0,18rem) minmax(0,1fr);gap:1rem;align-items:baseline}
}
.register-zeile dt{font-weight:600;font-size:.94rem}
.register-zeile dd{display:flex;flex-wrap:wrap;gap:.15rem .6rem}
.register-zeile dd button{font-family:var(--serif);font-style:italic;font-size:.94rem;color:var(--tinte-still)}
.register-zeile dd button:hover{color:var(--gruen)}
.buchstabe{
  font-family:var(--serif);font-size:1.3rem;color:var(--gruen);
  margin-top:1.5rem;padding-bottom:.2rem;border-bottom:2px solid var(--linie);
}

/* ---------- Lernen im Vollbild ----------
   Die Karte bekommt den ganzen Schirm. Die Breite wird aus der Hoehe
   gerechnet, damit das Format 1:1.5 hineinpasst, ohne dass man scrollen
   muss — auf einem breiten Schirm begrenzt dann wieder die Hoehe. */

.vollbild{
  width:100%;padding:0 clamp(12px,3.5vw,28px) 1.2rem;
  min-height:100dvh;display:flex;flex-direction:column;
  justify-content:center;gap:.9rem;
}
/* Die Breite wird aus der Hoehe gerechnet, damit das Format 1:1.5 auf den
   Schirm passt, ohne dass man scrollen muss. Auf einem breiten Schirm
   begrenzt dann wieder die Breite. */
.vollbild .blatt{max-width:min(29rem, calc((100dvh - 15rem) / 1.5));flex:0 0 auto}
.faecher{
  display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;
  font-size:.78rem;color:var(--tinte-still);
  font-variant-numeric:tabular-nums;padding-top:.9rem;
}
.faecher b{color:var(--tinte)}
.ganze{
  display:block;margin:0 auto;font-size:.8rem;
  color:var(--tinte-still);text-decoration:underline;
}
.ganze:hover{color:var(--gruen)}

/* ---------- Pruefung ---------- */

.stufen{display:grid;gap:.85rem;margin-top:1.4rem}
.stufe{
  display:grid;gap:.2rem;text-align:left;width:100%;
  border:1px solid var(--linie-stark);border-radius:12px;padding:1.05rem 1.15rem;
  transition:border-color .14s,transform .14s;
}
.stufe:hover{border-color:var(--gruen);transform:translateY(-2px)}
.stufe .name{font-family:var(--serif);font-size:1.3rem;line-height:1.2}
.stufe .satz{font-size:.85rem;color:var(--tinte-still)}
.stufe .zahlen{
  margin-top:.4rem;font-size:.78rem;color:var(--gruen);
  font-variant-numeric:tabular-nums;
}

.anzeige{
  display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;
  margin-top:1.2rem;font-size:.82rem;color:var(--tinte-still);
  font-variant-numeric:tabular-nums;
}
.anzeige .punkte{
  font-family:var(--serif);font-size:1.75rem;color:var(--tinte);
  line-height:1;margin-right:auto;
}
.serie{color:var(--gruen);font-weight:600}
.balken{
  height:3px;border-radius:99px;background:var(--linie);
  margin-top:.7rem;overflow:hidden;
}
.balken i{
  display:block;height:100%;background:var(--gruen);
  transition:width .35s cubic-bezier(.2,.7,.2,1);
}

.frage{
  font-family:var(--serif);font-size:clamp(1.3rem,5vw,1.7rem);
  line-height:1.3;margin-top:1.8rem;text-wrap:balance;
}
.frage em{font-style:italic;color:var(--gruen)}
.antworten{display:grid;gap:.55rem;margin-top:1.4rem}
.antwort{
  text-align:left;width:100%;
  border:1px solid var(--linie-stark);border-radius:10px;
  padding:.8rem .95rem;font-size:.98rem;line-height:1.35;
  transition:border-color .12s,background-color .12s;
}
.antwort:hover:not(:disabled){border-color:var(--gruen)}
.antwort:disabled{cursor:default}
.antwort.ist-richtig{
  border-color:var(--richtig);color:var(--richtig);font-weight:600;
  background:color-mix(in srgb,var(--richtig) 9%,transparent);
}
.antwort.ist-falsch{
  border-color:var(--falsch);color:var(--falsch);
  background:color-mix(in srgb,var(--falsch) 9%,transparent);
}
.antwort .lat{font-family:var(--serif);font-style:italic}

.eingabefeld{
  width:100%;font:inherit;font-size:1.1rem;font-family:var(--serif);
  color:var(--tinte);background:transparent;
  border:1px solid var(--linie-stark);border-radius:10px;
  padding:.75rem .9rem;margin-top:1.4rem;
}
.eingabefeld:disabled{opacity:1}
.eingabefeld.ist-richtig{border-color:var(--richtig);color:var(--richtig)}
.eingabefeld.ist-falsch{border-color:var(--falsch);color:var(--falsch)}

.urteil{margin-top:1.2rem;display:grid;gap:.35rem}
.urteil .spruch{font-weight:600}
.urteil .spruch.gut{color:var(--richtig)}
.urteil .spruch.schlecht{color:var(--falsch)}
.urteil .loesung{font-size:.92rem;color:var(--tinte-still)}

<div id="kopfplatz"></div>
<main id="buehne" tabindex="-1"></main>

<script src="karten.js"></script>
<script>
(function(){
"use strict";

var KARTEN = window.KARTEN || [];
var kopfplatz = document.getElementById("kopfplatz");
var buehne = document.getElementById("buehne");

/* ---------- Grundlagen ---------- */

/* Umlaute und ss faltweg, damit »Erkaeltung«, »Erkältung« und »ERKALTUNG«
   denselben Schluessel ergeben. NFD zerlegt den Umlaut in Buchstabe plus
   Zeichen, die Ersetzung danach raeumt die Zeichen weg.
   Der Bereich steht als \u0300-\u036f und nicht als die Zeichen selbst: die
   sind unsichtbar, haengen sich beim Kopieren an den Nachbarbuchstaben, und
   wird die Datei einmal ohne Zeichensatzangabe ausgeliefert, liest der Browser
   sie falsch herum ein — dann ist der Bereich verkehrt und die ganze App
   bleibt leer. */
function flach(s){
  return String(s || "").toLowerCase()
    .replace(/ß/g,"ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function schnipsel(s){
  return flach(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function el(tag,klasse,text){
  var n = document.createElement(tag);
  if(klasse) n.className = klasse;
  if(text != null) n.textContent = text;
  return n;
}
/* Vier gezeichnete Marken fuers Menue. Als Pfade und nicht als Schriftzeichen:
   ❧, ⌕ und ★ stammen aus verschiedenen Schriften, stehen in verschiedenen
   Groessen da und fehlen auf manchen Geraeten ganz. */
var MARKEN = {
  karten: ["M5 7h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z",
           "M9 4h9a2 2 0 0 1 2 2v11"],
  lernen: ["M20.5 12a8.5 8.5 0 1 1-2.5-6",
           "M20.5 3.5V9H15"],
  suchen: ["M10.5 3.5a7 7 0 1 0 0 14 7 7 0 0 0 0-14z",
           "M15.6 15.6 20.5 20.5"],
  pruefung: ["M12 3.4l2.6 5.4 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9z"]
};
function marke(art){
  var raum = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(raum,"svg");
  svg.setAttribute("viewBox","0 0 24 24");
  svg.setAttribute("class","marke");
  svg.setAttribute("aria-hidden","true");
  MARKEN[art].forEach(function(d){
    var pfad = document.createElementNS(raum,"path");
    pfad.setAttribute("d",d);
    svg.appendChild(pfad);
  });
  return svg;
}

function knopf(klasse,text,beiKlick){
  var b = el("button",klasse,text);
  b.addEventListener("click",beiKlick);
  return b;
}

/* Ein klickbares Wort mitten im Fliesstext. Siehe .verweis im Stilblatt: ein
   echter Knopf koennte hier nicht umbrechen. Die Tastatur bekommt er trotzdem,
   sonst waere er nur mit der Maus erreichbar. */
function verweis(klasse,text,beiKlick){
  var n = el("span","verweis" + (klasse ? " " + klasse : ""),text);
  n.setAttribute("role","button");
  n.tabIndex = 0;
  n.addEventListener("click", beiKlick);
  n.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); beiKlick(); }
  });
  return n;
}

function mischen(liste){
  var a = liste.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function zufall(liste){ return liste[Math.floor(Math.random() * liste.length)]; }

KARTEN.forEach(function(k){
  k.id = schnipsel(k.lat);
  /* Die Partnerpflanzen gehoeren in den Suchtext: wer »Cedrus libani« sucht,
     soll auch die Karten finden, die sie nur als Partner nennen. */
  k.suchtext = flach([k.lat, k.de, k.untertitel, k.seelisch,
    (k.indikationen || []).join(" "),
    (k.kombinationen || []).map(function(komb){
      return komb.partner.join(" ") + " " + komb.anlass;
    }).join(" ")].join(" "));
  k.vollstaendig = !!(k.untertitel && k.seelisch &&
    (k.indikationen || []).length && (k.kombinationen || []).length);
});
KARTEN.sort(function(a,b){ return a.lat.localeCompare(b.lat,"de"); });

function karteNach(id){
  for(var i=0;i<KARTEN.length;i++) if(KARTEN[i].id === id) return KARTEN[i];
  return null;
}
var FERTIG = KARTEN.filter(function(k){ return k.vollstaendig; }).length;

/* ---------- Gedaechtnis auf dem Geraet ----------
   Lernstand und Bestwerte gehoeren zum Geraet, nicht zum Kartensatz — deshalb
   der Browser und nicht das Repo. */

function merken(schluessel,vorgabe){
  return {
    lesen: function(){
      try{ return JSON.parse(localStorage.getItem(schluessel)) || vorgabe(); }
      catch(e){ return vorgabe(); }
    },
    schreiben: function(wert){
      try{ localStorage.setItem(schluessel, JSON.stringify(wert)); }catch(e){}
    }
  };
}
var lernstand = merken("gemmo-lernstand", function(){ return {}; });
var bestwerte = merken("gemmo-bestwerte", function(){ return {}; });

/* ---------- Bilder auf dem Geraet ----------
   Die Knospenbilder aus dem Set gehoeren nicht ins Repo — es sind fremde
   Aufnahmen. Wer sie in der App haben will, fotografiert die Kartenvorderseite
   selbst; die Aufnahme bleibt im Browser dieses Geraets.

   IndexedDB und nicht localStorage: fuenfzig Aufnahmen sprengen die fuenf
   Megabyte, die localStorage ueblicherweise hergibt, und zwar erst bei Karte
   vierzig — also genau dann, wenn die Arbeit schon getan waere.

   Beim Anzeigen gewinnt die eigene Aufnahme vor einer Datei in bilder/: sie
   ist die spaetere, ausdrueckliche Entscheidung. */

var BILDER = {};        /* Karten-Schluessel -> Objektadresse der Aufnahme */
var LAGER_DA = false;

function lager(){
  return new Promise(function(gut,schlecht){
    var db;
    try{ db = indexedDB.open("gemmo-bilder", 1); }
    catch(e){ schlecht(e); return; }
    db.onupgradeneeded = function(){ db.result.createObjectStore("knospen"); };
    db.onsuccess = function(){ gut(db.result); };
    db.onerror = function(){ schlecht(db.error); };
  });
}
function imLager(art, tun){
  return lager().then(function(db){
    return new Promise(function(gut,schlecht){
      var laden = db.transaction("knospen", art).objectStore("knospen");
      var frage = tun(laden);
      frage.onsuccess = function(){ gut(frage.result); };
      frage.onerror = function(){ schlecht(frage.error); };
    });
  });
}

/* Beim Start einmal alles holen und in den Speicher legen. Der Rest der App
   zeichnet synchron; ein Bild, das erst nach dem Zeichnen eintrifft, muesste
   ueberall nachgereicht werden. */
function bilderLaden(){
  if(!window.indexedDB) return Promise.resolve();
  return imLager("readonly", function(laden){ return laden.getAllKeys(); })
    .then(function(ids){
      LAGER_DA = true;
      if(!ids || !ids.length) return;
      return Promise.all(ids.map(function(id){
        return imLager("readonly", function(laden){ return laden.get(id); })
          .then(function(brocken){ if(brocken) BILDER[id] = URL.createObjectURL(brocken); });
      }));
    })
    .catch(function(){ LAGER_DA = false; });
}

function bildQuelle(k){
  if(BILDER[k.id]) return BILDER[k.id];
  if(!k.bild) return null;
  /* Sonst ein Dateiname neben der App — ausser die Vorschau hat das Bild
     schon als vollstaendige Adresse eingebettet. */
  return k.bild.indexOf("data:") === 0 ? k.bild : "bilder/" + k.bild;
}
function mitBild(){
  return KARTEN.filter(function(k){ return !!bildQuelle(k); }).length;
}

/* Verkleinert die Aufnahme, bevor sie ins Lager geht. Ein Telefonfoto bringt
   gut vier Megabyte mit, gezeigt wird das Bild 280 Punkte breit — 900 Punkte
   sind auch auf einem dreifach dichten Schirm mehr als genug. */
function verkleinern(datei){
  return createImageBitmap(datei).then(function(bild){
    var kante = 900;
    var faktor = Math.min(1, kante / Math.max(bild.width, bild.height));
    var breite = Math.round(bild.width * faktor);
    var hoehe = Math.round(bild.height * faktor);
    var tuch = document.createElement("canvas");
    tuch.width = breite; tuch.height = hoehe;
    tuch.getContext("2d").drawImage(bild, 0, 0, breite, hoehe);
    bild.close();
    return new Promise(function(gut){ tuch.toBlob(gut, "image/jpeg", 0.82); });
  });
}

function bildAufnehmen(k, danach){
  var eingabe = document.createElement("input");
  eingabe.type = "file";
  eingabe.accept = "image/*";
  eingabe.addEventListener("change", function(){
    var datei = eingabe.files && eingabe.files[0];
    if(!datei) return;
    verkleinern(datei)
      .then(function(brocken){
        return imLager("readwrite", function(laden){ return laden.put(brocken, k.id); })
          .then(function(){
            if(BILDER[k.id]) URL.revokeObjectURL(BILDER[k.id]);
            BILDER[k.id] = URL.createObjectURL(brocken);
          });
      })
      .then(danach)
      .catch(function(fehler){ melden("Die Aufnahme liess sich nicht ablegen: " + fehler); });
  });
  eingabe.click();
}

function bildEntfernen(k, danach){
  imLager("readwrite", function(laden){ return laden.delete(k.id); })
    .then(function(){
      if(BILDER[k.id]) URL.revokeObjectURL(BILDER[k.id]);
      delete BILDER[k.id];
    })
    .then(danach)
    .catch(function(fehler){ melden("Die Aufnahme liess sich nicht entfernen: " + fehler); });
}

function melden(text){
  var p = el("p","bildzeile",text);
  p.style.color = "var(--fehlt)";
  buehne.appendChild(p);
}

/* ---------- Weg und Adresse ----------
   Der Zustand steht in der Adresszeile, nicht in einer Variablen: dann traegt
   der Zurueck-Knopf des Telefons die Navigation, und ein Lesezeichen auf eine
   einzelne Knospe funktioniert. */

function ziel(){
  var teile = location.hash.replace(/^#\/?/,"").split("/");
  return { weg: teile[0] || "start", was: decodeURIComponent(teile[1] || "") };
}
function gehe(pfad){ location.hash = "#/" + pfad; }

var ORTE = {
  karten:  { name:"Der Stapel",  bauen:stapel },
  karte:   { name:"Karte",       bauen:einzelkarte },
  suchen:  { name:"Suchen",      bauen:suchen },
  lernen:  { name:"Lernen",      bauen:lernen,   vollbild:true },
  pruefung:{ name:"Prüfung",     bauen:pruefung }
};

function zeichne(){
  var z = ziel();
  var ort = ORTE[z.weg];

  /* Wer die Pruefung verlaesst, verliert den Durchgang. Das ist Absicht:
     ein halb gespielter Durchgang, den man Tage spaeter wiederfindet, waere
     kein Ergebnis mehr. */
  if(z.weg !== "pruefung") durchgang = null;
  if(z.weg !== "lernen") lernblatt = null;
  clearTimeout(suchtakt);

  kopfplatz.innerHTML = "";
  buehne.innerHTML = "";
  buehne.className = ort && ort.vollbild ? "vollbild" : "spalte";

  if(!ort){ startbild(); return; }

  kopf(ort.name);
  ort.bauen(z.was);
}

function kopf(name){
  var leiste = el("header","kopf"), innen = el("div","spalte");
  innen.appendChild(knopf("zurueck","‹ Menü", function(){ gehe(""); }));
  innen.appendChild(el("span","ortsname",name));
  leiste.appendChild(innen);
  kopfplatz.appendChild(leiste);
}

window.addEventListener("hashchange", function(){
  zeichne();
  buehne.focus({preventScroll:true});
  window.scrollTo(0,0);
});

/* ---------- Startbildschirm ---------- */

function startbild(){
  var s = el("section","start");

  var wappen = el("div","wappen");
  var h = el("h1",null,"Gemmotherapie");
  h.appendChild(el("span","zweitzeile","Die fünfzig Knospen"));
  wappen.appendChild(h);
  var stand = FERTIG + " von 50 Karten erfasst";
  if(KARTEN.length > FERTIG) stand += " · " + (KARTEN.length - FERTIG) + " angefangen";
  wappen.appendChild(el("span","stand",stand));
  s.appendChild(wappen);

  var beste = bestwerte.lesen();
  var bestwert = Math.max(beste.leicht || 0, beste.mittel || 0, beste.schwer || 0);
  var kasten = lernstand.lesen();
  var sitzt = lernbare().filter(function(k){ return (kasten[k.id] || 1) === 3; }).length;

  var wege = [
    { weg:"karten",   name:"Karten",  satz:"Durchblättern, umdrehen, nichts wollen.",
      zahl:KARTEN.length + (KARTEN.length === 1 ? " Karte" : " Karten") +
           ", " + mitBild() + " mit Bild" },
    { weg:"lernen",   name:"Lernen",  satz:"Vollbild, Vorderseite raten, umdrehen, selbst bewerten.",
      zahl: sitzt ? sitzt + " sitzen schon" : "Karteikasten, drei Fächer" },
    { weg:"suchen",   name:"Suchen",  satz:"Vom Symptom zur Knospe. Auch das ganze Register.",
      zahl: registerbegriffe().length + " Indikationen" },
    { weg:"pruefung", name:"Prüfung", satz:"Abgefragt werden, drei Stufen, mit Punkten.",
      zahl: bestwert ? "Bestwert " + bestwert : "Noch kein Bestwert" }
  ];

  var gitter = el("div","wege");
  wege.forEach(function(w){
    var b = el("button","weg"), rand = el("div","weg-rand");
    rand.appendChild(marke(w.weg));
    rand.appendChild(el("span","name",w.name));
    rand.appendChild(el("span","satz",w.satz));
    rand.appendChild(el("span","marke-zahl",w.zahl));
    b.appendChild(rand);
    b.addEventListener("click", function(){ gehe(w.weg); });
    gitter.appendChild(b);
  });
  s.appendChild(gitter);
  buehne.appendChild(s);
}

/* ---------- Die Karte ----------
   Eine Funktion fuer alle Orte, an denen eine Karte auftaucht: beim
   Nachschlagen und beim Lernen. Waeren es zwei, liefen sie auseinander. */

function kartenblatt(k, mitAufnahme){
  var blatt = el("div","blatt");
  blatt.dataset.gedreht = "false";

  var dreh = el("div","dreh");
  dreh.appendChild(el("div","mass"));
  var vorne = seiteVorne(k, mitAufnahme), hinten = seiteHinten(k);
  dreh.appendChild(vorne);
  dreh.appendChild(hinten);
  blatt.appendChild(dreh);

  /* Die abgewandte Seite bleibt im Dokument — sonst gaebe es nichts zu drehen —
     aber sie ist fuer Maus, Tastatur und Screenreader nicht da. Ohne das
     laesst sich auf der Vorderseite eine Partnerpflanze antippen, die man
     gar nicht sieht. */
  function seitenSchalten(){
    var gedreht = blatt.dataset.gedreht === "true";
    (gedreht ? vorne : hinten).setAttribute("inert","");
    (gedreht ? hinten : vorne).removeAttribute("inert");
    blatt.setAttribute("aria-label",
      (gedreht ? "Rückseite" : "Vorderseite") + " von " + k.lat + ", " + k.de);
  }
  seitenSchalten();

  blatt.umdrehen = function(){
    blatt.dataset.gedreht = blatt.dataset.gedreht === "true" ? "false" : "true";
    seitenSchalten();
    if(blatt.beiDrehung) blatt.beiDrehung(blatt.dataset.gedreht === "true");
  };

  /* Tippen auf das Blatt dreht — ausser man hat einen Verweis darin getroffen.
     Der Knopf unter der Karte macht dasselbe und ist der Weg fuer die
     Tastatur; das Blatt selbst bekommt deshalb keinen eigenen Fokus, sonst
     saessen Knoepfe in einem Knopf. */
  blatt.addEventListener("click", function(e){
    if(e.target.closest("button,[role=button]")) return;
    blatt.umdrehen();
  });

  return blatt;
}

function seiteVorne(k, mitAufnahme){
  var seite = el("div","seite vorne"), rand = el("div","rand");

  var feld = el("div","knospe-feld");
  var quelle = bildQuelle(k);
  if(quelle){
    var img = document.createElement("img");
    img.src = quelle;
    img.alt = "Knospe von " + k.de;
    feld.appendChild(img);
  }else if(mitAufnahme && LAGER_DA){
    /* Ein Knopf im Blatt dreht die Karte nicht um — darum kuemmert sich der
       Klickfaenger in kartenblatt(). */
    var auf = knopf("knospe-leer knospe-aufnehmen","Knospe fotografieren", function(){
      bildAufnehmen(k, function(){ zeichne(); });
    });
    auf.appendChild(el("span","klein","Kartenvorderseite, ganzes Bild — bleibt auf diesem Gerät"));
    feld.appendChild(auf);
  }else{
    feld.appendChild(el("div","knospe-leer","Bild der Knospe fehlt noch"));
  }
  rand.appendChild(feld);

  var namen = el("div","namen");
  namen.appendChild(el("span","lat",k.lat));
  namen.appendChild(el("span","de",k.de));
  namen.appendChild(k.untertitel
    ? el("span","unter",k.untertitel)
    : el("span","unter offen","Untertitel fehlt noch"));
  rand.appendChild(namen);

  seite.appendChild(rand);
  return seite;
}

function seiteHinten(k){
  var seite = el("div","seite hinten"), rand = el("div","rand");
  rand.appendChild(el("p","reihe","Phytopharmas Pflanzenkinder"));
  rand.appendChild(abschnittSeelisch(k));
  rand.appendChild(abschnittIndikationen(k));
  rand.appendChild(abschnittKombinationen(k));
  rand.appendChild(el("p","karte-quelle",
    "aus dem Buch »Gemmotherapie« von Chrischta Ganz und Louis Hutter"));
  seite.appendChild(rand);
  return seite;
}

function abschnittSeelisch(k){
  var a = el("section","abschnitt");
  a.appendChild(el("h2",null,"Seelische Aspekte"));
  if(!k.seelisch){ a.appendChild(el("p","offen","fehlt noch")); return a; }
  /* Manche Karten setzen mitten in den Absatz einen Warnsatz (»Vorsicht: Nicht
     waehrend der Schwangerschaft ... einnehmen!«). Der Wortlaut bleibt
     unangetastet und an seiner Stelle — er wird nur sichtbar abgesetzt, damit
     er beim Ueberfliegen nicht untergeht. Gefunden wird er am Wort, nicht an
     einem eigenen Feld: sonst muesste man beim Abschreiben entscheiden, was
     eine Warnung ist, und irgendwann entscheidet man falsch. */
  var teilung = k.seelisch.indexOf("Vorsicht:");
  if(teilung === -1){
    a.appendChild(el("p",null,k.seelisch));
  }else{
    var davor = k.seelisch.slice(0,teilung).trim();
    if(davor) a.appendChild(el("p",null,davor));
    a.appendChild(el("p","vorsicht",k.seelisch.slice(teilung).trim()));
  }
  return a;
}

function abschnittIndikationen(k){
  var a = el("section","abschnitt");
  a.appendChild(el("h2",null,"Indikationen"));
  if(!(k.indikationen || []).length){ a.appendChild(el("p","offen","fehlt noch")); return a; }
  var p = el("p","indikationen");
  k.indikationen.forEach(function(i,n){
    if(n) p.appendChild(document.createTextNode(", "));
    /* Von der Indikation in die Suche: was hilft sonst noch dagegen? */
    p.appendChild(verweis(null,i,function(){ gehe("suchen/" + encodeURIComponent(i)); }));
  });
  p.appendChild(document.createTextNode("."));
  a.appendChild(p);
  return a;
}

function abschnittKombinationen(k){
  var a = el("section","abschnitt");
  a.appendChild(el("h2",null,"Bewährte Kombinationen"));
  if(!(k.kombinationen || []).length){ a.appendChild(el("p","offen","fehlt noch")); return a; }
  var ul = el("ul","kombis");
  k.kombinationen.forEach(function(komb){
    var li = el("li");
    komb.partner.forEach(function(name,i){
      /* Meist steht ein Plus zwischen den Partnern, manchmal aber etwas
         anderes (»Rosa canina im Wechsel mit Ribes nigrum«) — und das ist
         keine Feinheit: zusammen genommen ist nicht abwechselnd genommen. */
      if(i) li.appendChild(komb.verbindung
        ? el("span","verbindung"," " + komb.verbindung + " ")
        : el("span","plus"," + "));
      var karte = karteNach(schnipsel(name));
      if(karte){
        li.appendChild(verweis("partner",name,function(){ gehe("karte/" + karte.id); }));
      }else{
        /* Partner noch nicht abgeschrieben: der Name steht da, nur ohne Weg. */
        li.appendChild(el("span","tot",name));
      }
    });
    /* Der Anlass bringt sein Bindewort selbst mit — »bei Gicht«, »zur
       Lymphreinigung«, », um die Cortisolproduktion anzuregen«. Vor einem
       Komma darf kein Leerzeichen stehen. */
    li.appendChild(document.createTextNode(
      (komb.anlass.charAt(0) === "," ? "" : " ") + komb.anlass));
    ul.appendChild(li);
  });
  a.appendChild(ul);
  return a;
}

/* ---------- Weg 1: der Stapel ---------- */

function kartenkachel(k, hervorhebung){
  var b = el("button","eintrag"), rand = el("div","rand");

  var feld = el("div","knospe-feld");
  var quelle = bildQuelle(k);
  if(quelle){
    var img = document.createElement("img");
    img.src = quelle; img.alt = "";
    feld.appendChild(img);
  }else{
    /* Hier kein Knopf: die Kachel ist selbst einer, und Knoepfe in Knoepfen
       gibt es nicht. Aufgenommen wird auf der geoeffneten Karte. */
    feld.appendChild(el("div","knospe-leer","Bild fehlt"));
  }
  rand.appendChild(feld);

  var namen = el("div","namen");
  namen.appendChild(el("span","lat",k.lat));
  namen.appendChild(el("span","de",k.de));
  if(k.untertitel) namen.appendChild(el("span","unter",k.untertitel));
  rand.appendChild(namen);

  if(hervorhebung) rand.appendChild(el("p","treffer",hervorhebung));
  if(!k.vollstaendig) rand.appendChild(el("p","luecke","Rückseite unvollständig"));

  b.appendChild(rand);
  b.addEventListener("click", function(){ gehe("karte/" + k.id); });
  return b;
}

function stapel(){
  if(!KARTEN.length){
    buehne.appendChild(el("p","leer","Noch keine Karte erfasst. Die Abschriften kommen in karten.js."));
    return;
  }
  var gitter = el("div","gitter");
  KARTEN.forEach(function(k){ gitter.appendChild(kartenkachel(k,null)); });
  buehne.appendChild(gitter);
}

function einzelkarte(id){
  var k = karteNach(id);
  if(!k){ gehe("karten"); return; }

  var blatt = kartenblatt(k, true);
  blatt.style.marginTop = "1.4rem";
  buehne.appendChild(blatt);

  var reihe = el("div","karte-knoepfe knopfreihe");
  var drehen = knopf("knopf knopf-haupt","Umdrehen", function(){ blatt.umdrehen(); });
  reihe.appendChild(drehen);
  reihe.appendChild(knopf("knopf","Alle Knospen", function(){ gehe("karten"); }));
  buehne.appendChild(reihe);

  blatt.beiDrehung = function(gedreht){
    drehen.textContent = gedreht ? "Zurückdrehen" : "Umdrehen";
  };

  /* Nur wenn schon eine eigene Aufnahme da ist: das leere Feld auf der
     Vorderseite ist selbst der Weg zur ersten. */
  if(BILDER[k.id]){
    var bildzeile = el("p","bildzeile");
    bildzeile.appendChild(document.createTextNode("Eigene Aufnahme · "));
    bildzeile.appendChild(knopf(null,"ersetzen", function(){
      bildAufnehmen(k, function(){ zeichne(); });
    }));
    bildzeile.appendChild(document.createTextNode(" · "));
    bildzeile.appendChild(knopf(null,"entfernen", function(){
      bildEntfernen(k, function(){ zeichne(); });
    }));
    buehne.appendChild(bildzeile);
  }

  buehne.appendChild(el("p","nachsatz",
    "Tippen dreht die Karte · private Abschrift zum Nachschlagen"));
}

/* ---------- Weg 2: Suchen ----------
   Das Register wird nicht gepflegt, es faellt aus den Karten heraus. Sonst
   laufen Karte und Register auseinander, sobald eine Indikation dazukommt.
   Leeres Suchfeld zeigt das ganze Register — das ist die blaetterbare Form
   derselben Frage. */

function registerbegriffe(){
  var nach = {};
  KARTEN.forEach(function(k){
    (k.indikationen || []).forEach(function(i){
      var schluessel = flach(i);
      if(!nach[schluessel]) nach[schluessel] = { wort:i, karten:[] };
      nach[schluessel].karten.push(k);
    });
  });
  return Object.keys(nach).map(function(s){ return nach[s]; })
    .sort(function(a,b){ return a.wort.localeCompare(b.wort,"de"); });
}

/* Zeigt, welche Indikation den Treffer ausgeloest hat. Ohne das steht bei der
   Suche nach »Ekzem« eine Liste von Pflanzennamen da, in der nichts das Wort
   Ekzem enthaelt, und man traut der Suche nicht mehr. */
function trefferzeile(k,f){
  if(flach(k.lat).indexOf(f) !== -1 || flach(k.de).indexOf(f) !== -1) return null;
  var passend = (k.indikationen || []).filter(function(i){ return flach(i).indexOf(f) !== -1; });
  if(!passend.length) return null;
  return passend.slice(0,2).join(", ") + (passend.length > 2 ? " …" : "");
}

function suchen(vorgabe){
  var frage = vorgabe || "";

  var zeile = el("div","suchzeile");
  var feld = document.createElement("input");
  feld.className = "suche";
  feld.type = "search";
  feld.autocomplete = "off";
  feld.spellcheck = false;
  feld.placeholder = "Indikation, Pflanze oder Partner";
  feld.setAttribute("aria-label","Suchen");
  feld.value = frage;
  zeile.appendChild(feld);
  buehne.appendChild(zeile);

  var hinweis = el("p","suchhinweis");
  buehne.appendChild(hinweis);

  var ergebnis = el("div");
  buehne.appendChild(ergebnis);

  function zeigen(){
    ergebnis.innerHTML = "";
    var f = flach(frage.trim());

    if(!f){
      hinweis.textContent = "Sucht in Namen, Untertiteln, seelischen Aspekten, " +
        "Indikationen und Partnerpflanzen. Unten steht das ganze Register.";
      ergebnis.appendChild(el("p","trennung","Register aller Indikationen"));
      registerListe(ergebnis, registerbegriffe(), true);
      return;
    }

    var karten = KARTEN.filter(function(k){ return k.suchtext.indexOf(f) !== -1; });
    var begriffe = registerbegriffe().filter(function(b){ return flach(b.wort).indexOf(f) !== -1; });

    hinweis.textContent = karten.length
      ? karten.length + (karten.length === 1 ? " Karte" : " Karten") + " zu »" + frage.trim() + "«"
      : "Nichts gefunden zu »" + frage.trim() + "«. Möglich, dass die Karte noch nicht abgeschrieben ist.";

    if(karten.length){
      var gitter = el("div","gitter");
      karten.forEach(function(k){ gitter.appendChild(kartenkachel(k, trefferzeile(k,f))); });
      ergebnis.appendChild(gitter);
    }
    if(begriffe.length){
      ergebnis.appendChild(el("p","trennung","Passende Indikationen"));
      registerListe(ergebnis, begriffe, false);
    }
  }

  feld.addEventListener("input", function(){
    frage = feld.value;
    /* Die Adresszeile mitfuehren, aber nicht bei jedem Tastendruck: sonst
       braucht der Zurueck-Knopf des Telefons einen Druck pro Buchstabe.
       Der zweite Blick auf den Ort ist kein Ueberfluss: zwischen Tastendruck
       und Ablauf kann man laengst woanders sein. */
    clearTimeout(suchtakt);
    suchtakt = setTimeout(function(){
      if(ziel().weg !== "suchen") return;
      history.replaceState(null,"","#/suchen/" + encodeURIComponent(frage.trim()));
    }, 400);
    zeigen();
  });

  zeigen();
  if(!frage) feld.focus();
}

function registerListe(wohin, begriffe, mitBuchstaben){
  if(!begriffe.length){
    wohin.appendChild(el("p","leer","Noch keine Indikationen erfasst."));
    return;
  }
  var dl = null, letzter = "";
  begriffe.forEach(function(b){
    var anfang = b.wort.charAt(0).toUpperCase();
    if(mitBuchstaben && anfang !== letzter){
      letzter = anfang;
      wohin.appendChild(el("h2","buchstabe",anfang));
      dl = el("dl","register");
      wohin.appendChild(dl);
    }else if(!dl){
      dl = el("dl","register");
      wohin.appendChild(dl);
    }
    var zeile = el("div","register-zeile");
    zeile.appendChild(el("dt",null,b.wort));
    var dd = el("dd");
    b.karten.forEach(function(k){
      var kn = knopf(null,k.lat, function(){ gehe("karte/" + k.id); });
      kn.title = k.de;
      dd.appendChild(kn);
    });
    zeile.appendChild(dd);
    dl.appendChild(zeile);
  });
}

/* ---------- Weg 3: Lernen im Vollbild ----------
   Karteikasten nach Leitner, drei Faecher. Gezogen wird immer aus dem
   niedrigsten Fach, das noch etwas enthaelt; das reicht fuer fuenfzig Karten
   und braucht keine Datumsrechnung. */

var aktuelle = null;
var lernblatt = null;
/* Die Suche schreibt ihren Begriff verzoegert in die Adresszeile. Der Griff
   darauf liegt hier oben, damit jeder Ortswechsel ihn abraeumen kann — sonst
   schreibt ein Nachzuegler die Adresse zurueck, nachdem man die Suche laengst
   verlassen hat. Bildschirm und Adresse gingen dann auseinander, und alles,
   was sich nach der Adresse richtet, liefe ins Leere. */
var suchtakt = null;

function lernbare(){
  return KARTEN.filter(function(k){
    return k.seelisch || (k.indikationen || []).length;
  });
}

function lernen(){
  var vorrat = lernbare();
  if(!vorrat.length){
    buehne.appendChild(el("p","leer",
      "Zum Abfragen fehlen noch die Rückseiten. Sobald eine Karte " +
      "seelische Aspekte oder Indikationen hat, taucht sie hier auf."));
    return;
  }

  var stand = lernstand.lesen();
  var faecher = [0,0,0];
  vorrat.forEach(function(k){ faecher[(stand[k.id] || 1) - 1]++; });

  var leiste = el("div","faecher");
  ["Neu und schwierig","Sitzt halbwegs","Sitzt"].forEach(function(name,i){
    var s = el("span",null,name + ": ");
    s.appendChild(el("b",null,String(faecher[i])));
    leiste.appendChild(s);
  });
  buehne.appendChild(leiste);

  if(!aktuelle || vorrat.indexOf(aktuelle) === -1) aktuelle = ziehen(vorrat,stand);

  lernblatt = kartenblatt(aktuelle);
  buehne.appendChild(lernblatt);

  var reihe = el("div","karte-knoepfe knopfreihe");
  buehne.appendChild(reihe);

  /* Vor dem Umdrehen gibt es nichts zu bewerten — man haette ja noch nicht
     nachgesehen. Deshalb wechseln die Knoepfe mit der Seite. */
  function knoepfeSetzen(gedreht){
    reihe.innerHTML = "";
    if(!gedreht){
      reihe.appendChild(knopf("knopf knopf-haupt","Umdrehen", function(){ lernblatt.umdrehen(); }));
    }else{
      reihe.appendChild(knopf("knopf","Nochmal", function(){ bewerten("nochmal"); }));
      reihe.appendChild(knopf("knopf knopf-haupt","Gewusst", function(){ bewerten("gewusst"); }));
    }
  }
  knoepfeSetzen(false);
  lernblatt.beiDrehung = knoepfeSetzen;

  buehne.appendChild(knopf("ganze","Diese Karte im Nachschlagewerk öffnen",
    function(){ gehe("karte/" + aktuelle.id); }));
  buehne.appendChild(el("p","nachsatz",
    "Tippen dreht · Leertaste ebenfalls, 1 und 2 bewerten"));
}

function ziehen(stapel,stand){
  for(var fach=1; fach<=3; fach++){
    var drin = stapel.filter(function(k){
      return (stand[k.id] || 1) === fach && k !== aktuelle;
    });
    if(drin.length) return zufall(drin);
  }
  return zufall(stapel);
}

function bewerten(urteil){
  var stand = lernstand.lesen();
  var fach = stand[aktuelle.id] || 1;
  /* Nicht gewusst faellt immer ganz zurueck ins erste Fach, gewusst steigt um
     eins. Das ist die ganze Leitner-Regel. */
  stand[aktuelle.id] = urteil === "gewusst" ? Math.min(3, fach + 1) : 1;
  lernstand.schreiben(stand);
  aktuelle = ziehen(lernbare(),stand);
  buehne.innerHTML = "";
  lernen();
}

document.addEventListener("keydown", function(e){
  if(ziel().weg !== "lernen" || !lernblatt) return;
  if(e.key === " "){ e.preventDefault(); lernblatt.umdrehen(); return; }
  if(lernblatt.dataset.gedreht !== "true") return;
  if(e.key === "1") bewerten("nochmal");
  if(e.key === "2") bewerten("gewusst");
});

/* ---------- Weg 4: Prüfung ----------
   Die Fragen werden aus den Karten gebaut, nie aus dem Gedaechtnis der App.
   Jeder Fragetyp sagt selbst, ob er mit dem vorhandenen Bestand ueberhaupt
   moeglich ist — bei acht Karten gibt es noch nicht zu allem eine Frage, und
   eine Frage ohne Ablenkung waere geschenkt. */

var STUFEN = {
  leicht: { name:"Leicht", satz:"Vier Antworten zur Wahl.",            optionen:4, punkte:10, art:"wahl" },
  mittel: { name:"Mittel", satz:"Sechs Antworten, auch Kombinationen.", optionen:6, punkte:20, art:"wahl" },
  schwer: { name:"Schwer", satz:"Kein Vorschlag. Selber schreiben.",    optionen:0, punkte:40, art:"schrift" }
};
var RUNDE = 10;

var FRAGETYPEN = [
  {
    id:"lat-de", stufen:["leicht","mittel","schwer"],
    passt: function(k){ return !!k.de; },
    bauen: function(k){
      return {
        frage:"Wie heisst " + kursiv(k.lat) + " auf Deutsch?",
        richtig:k.de,
        ablenker: function(andere){ return andere.map(function(x){ return x.de; }); },
        loesungen:[k.de]
      };
    }
  },
  {
    id:"de-lat", stufen:["leicht","mittel","schwer"],
    passt: function(k){ return !!k.lat; },
    bauen: function(k){
      return {
        frage:"Wie heisst " + kursiv(k.de) + " botanisch?",
        richtig:k.lat, botanisch:true,
        ablenker: function(andere){ return andere.map(function(x){ return x.lat; }); },
        loesungen:[k.lat]
      };
    }
  },
  {
    id:"untertitel", stufen:["leicht","mittel","schwer"],
    passt: function(k){ return !!k.untertitel; },
    bauen: function(k){
      return {
        frage:"Welche Knospe ist " + kursiv("»" + k.untertitel + "«") + "?",
        richtig:k.lat, botanisch:true,
        ablenker: function(andere){ return andere.map(function(x){ return x.lat; }); },
        loesungen:[k.lat, k.de]
      };
    }
  },
  {
    id:"indikation", stufen:["leicht","mittel","schwer"],
    /* Nur Indikationen, die auf genau einer Karte stehen — sonst haette die
       Frage zwei richtige Antworten und die Punktzahl waere Glueckssache. */
    passt: function(k){ return einzelindikationen(k).length > 0; },
    bauen: function(k){
      return {
        frage:"Auf welcher Karte steht " + kursiv(zufall(einzelindikationen(k))) + "?",
        richtig:k.lat, botanisch:true,
        ablenker: function(andere){ return andere.map(function(x){ return x.lat; }); },
        loesungen:[k.lat, k.de]
      };
    }
  },
  {
    id:"welche-indikation", stufen:["mittel"],
    passt: function(k){ return (k.indikationen || []).length > 0; },
    bauen: function(k){
      return {
        frage:"Welche Indikation steht auf der Karte " + kursiv(k.lat) + "?",
        richtig:zufall(k.indikationen),
        /* Ablenker duerfen nicht zufaellig doch auf dieser Karte stehen. */
        ablenker: function(andere){
          var eigen = {};
          (k.indikationen || []).forEach(function(i){ eigen[flach(i)] = true; });
          var fremd = [];
          andere.forEach(function(x){
            (x.indikationen || []).forEach(function(i){
              if(!eigen[flach(i)]) fremd.push(i);
            });
          });
          return fremd;
        },
        loesungen:k.indikationen.slice()
      };
    }
  },
  {
    id:"kombination", stufen:["mittel","schwer"],
    passt: function(k){ return einzelkombis(k).length > 0; },
    bauen: function(k){
      var komb = zufall(einzelkombis(k));
      return {
        frage:"Womit kombiniert man " + kursiv(k.lat) + " " + komb.anlass.replace(/^,\s*/,"") + "?",
        richtig:komb.partner[0], botanisch:true,
        ablenker: function(andere){
          var eigen = {};
          (k.kombinationen || []).forEach(function(c){
            c.partner.forEach(function(p){ eigen[flach(p)] = true; });
          });
          var fremd = [];
          andere.forEach(function(x){
            if(!eigen[flach(x.lat)]) fremd.push(x.lat);
            (x.kombinationen || []).forEach(function(c){
              c.partner.forEach(function(p){ if(!eigen[flach(p)]) fremd.push(p); });
            });
          });
          return fremd;
        },
        loesungen:[komb.partner[0]]
      };
    }
  }
];

/* Klammert eine Stelle, die im Fragetext hervorgehoben werden soll. Zwei
   Steuerzeichen als Klammern: in Pflanzennamen und Indikationen kommen sie
   nicht vor. Als \u0001 und \u0002 geschrieben und nicht als die Zeichen
   selbst — die waeren im Quelltext unsichtbar. */
var AUF = "\u0001", ZU = "\u0002";
function kursiv(s){ return AUF + s + ZU; }

/* Baut den Fragetext als Knoten: die mit kursiv() markierten Stellen werden
   hervorgehoben. Ueber Textknoten und nicht ueber innerHTML — in den Fragen
   stehen Pflanzennamen und Indikationen aus den Daten, und Daten gehoeren
   nie in eine HTML-Zeichenkette. */
function fragetext(s){
  var p = el("p","frage");
  s.split(AUF).forEach(function(teil,i){
    if(i === 0){ if(teil) p.appendChild(document.createTextNode(teil)); return; }
    var zu = teil.indexOf(ZU);
    p.appendChild(el("em",null,teil.slice(0,zu)));
    var rest = teil.slice(zu + 1);
    if(rest) p.appendChild(document.createTextNode(rest));
  });
  return p;
}

function einzelindikationen(k){
  return (k.indikationen || []).filter(function(i){
    var f = flach(i);
    return KARTEN.filter(function(x){
      return (x.indikationen || []).some(function(j){ return flach(j) === f; });
    }).length === 1;
  });
}
function einzelkombis(k){
  return (k.kombinationen || []).filter(function(c){ return c.partner.length === 1; });
}

function pruefbare(){
  return KARTEN.filter(function(k){ return k.vollstaendig; });
}

function fragenBauen(stufe){
  var vorrat = pruefbare();
  var typen = FRAGETYPEN.filter(function(t){ return t.stufen.indexOf(stufe) !== -1; });
  var fragen = [];
  var reihenfolge = mischen(vorrat);
  var i = 0, versuche = 0;

  while(fragen.length < RUNDE && versuche < RUNDE * 12){
    versuche++;
    var k = reihenfolge[i % reihenfolge.length];
    i++;
    var moeglich = typen.filter(function(t){ return t.passt(k); });
    if(!moeglich.length) continue;
    var typ = zufall(moeglich);
    var f = typ.bauen(k);
    f.karte = k;
    f.typ = typ.id;
    f.stufe = stufe;

    if(STUFEN[stufe].art === "wahl"){
      var andere = vorrat.filter(function(x){ return x !== k; });
      var moegliche = f.ablenker(andere).filter(function(a){ return flach(a) !== flach(f.richtig); });
      /* Doppelte raus: bei »Ribes nigrum« als Partner kaeme der Name sonst
         mehrfach in derselben Auswahl vor. */
      var gesehen = {}, sauber = [];
      moegliche.forEach(function(a){
        if(gesehen[flach(a)]) return;
        gesehen[flach(a)] = true; sauber.push(a);
      });
      var gebraucht = STUFEN[stufe].optionen - 1;
      if(sauber.length < gebraucht) continue;
      f.optionen = mischen(mischen(sauber).slice(0,gebraucht).concat([f.richtig]));
    }
    fragen.push(f);
  }
  return fragen;
}

var durchgang = null;

function pruefung(was){
  if(!STUFEN[was]){ stufenwahl(); return; }
  if(!durchgang || durchgang.stufe !== was){
    var fragen = fragenBauen(was);
    if(!fragen.length){ zuwenig(was); return; }
    durchgang = { stufe:was, fragen:fragen, nr:0, punkte:0, serie:0, beste:0, blatt:[] };
  }
  if(durchgang.nr >= durchgang.fragen.length) ergebnis();
  else frageZeigen();
}

function stufenwahl(){
  var beste = bestwerte.lesen();
  var vorrat = pruefbare();

  buehne.appendChild(el("p","suchhinweis",
    "Gefragt wird nur aus vollständig erfassten Karten — " + vorrat.length +
    " von 50. Zehn Fragen pro Durchgang."));

  var gitter = el("div","stufen");
  Object.keys(STUFEN).forEach(function(schluessel){
    var s = STUFEN[schluessel];
    var b = el("button","stufe");
    b.appendChild(el("span","name",s.name));
    b.appendChild(el("span","satz",s.satz));
    b.appendChild(el("span","zahlen",
      s.punkte + " Punkte je Treffer" +
      (beste[schluessel] ? " · Bestwert " + beste[schluessel] : "")));
    b.addEventListener("click", function(){ gehe("pruefung/" + schluessel); });
    gitter.appendChild(b);
  });
  buehne.appendChild(gitter);
}

function zuwenig(stufe){
  buehne.appendChild(el("p","leer",
    "Für die Stufe »" + STUFEN[stufe].name + "« sind noch zu wenige Karten " +
    "vollständig erfasst. Es braucht genug verschiedene Antworten, sonst wäre " +
    "die Frage geschenkt."));
  var reihe = el("div","knopfreihe");
  reihe.style.marginTop = "1.5rem";
  reihe.appendChild(knopf("knopf","Andere Stufe", function(){ gehe("pruefung"); }));
  buehne.appendChild(reihe);
}

function anzeigeleiste(){
  var d = durchgang;
  var leiste = el("div","anzeige");
  leiste.appendChild(el("span","punkte",String(d.punkte)));
  leiste.appendChild(el("span",null,"Frage " + Math.min(d.nr + 1, d.fragen.length) +
    " von " + d.fragen.length));
  if(d.serie >= 2) leiste.appendChild(el("span","serie","Serie " + d.serie));
  buehne.appendChild(leiste);

  var balken = el("div","balken"), fuellung = el("i");
  fuellung.style.width = (d.nr / d.fragen.length * 100) + "%";
  balken.appendChild(fuellung);
  buehne.appendChild(balken);
}

function frageZeigen(){
  var d = durchgang, f = d.fragen[d.nr];
  anzeigeleiste();
  buehne.appendChild(fragetext(f.frage));

  if(STUFEN[d.stufe].art === "wahl") wahlZeigen(f);
  else schriftZeigen(f);
}

function wahlZeigen(f){
  var kasten = el("div","antworten");
  var knoepfe = [];
  f.optionen.forEach(function(text){
    var b = el("button","antwort");
    b.appendChild(el("span", f.botanisch ? "lat" : null, text));
    b.addEventListener("click", function(){
      knoepfe.forEach(function(x){ x.disabled = true; });
      var stimmt = flach(text) === flach(f.richtig);
      knoepfe.forEach(function(x){
        if(flach(x.textContent) === flach(f.richtig)) x.classList.add("ist-richtig");
      });
      if(!stimmt) b.classList.add("ist-falsch");
      auswerten(f, stimmt, text);
    });
    knoepfe.push(b);
    kasten.appendChild(b);
  });
  buehne.appendChild(kasten);
}

function schriftZeigen(f){
  var feld = document.createElement("input");
  feld.className = "eingabefeld";
  feld.type = "text";
  feld.autocomplete = "off";
  feld.spellcheck = false;
  feld.placeholder = f.botanisch ? "Botanischer Name" : "Antwort";
  feld.setAttribute("aria-label","Antwort");
  buehne.appendChild(feld);

  var reihe = el("div","knopfreihe weiterzeile");
  var senden = knopf("knopf knopf-haupt","Antworten", pruefen);
  reihe.appendChild(senden);
  buehne.appendChild(reihe);

  function pruefen(){
    if(feld.disabled) return;
    var stimmt = f.loesungen.some(function(l){ return trifft(feld.value, l); });
    feld.disabled = true;
    senden.remove();
    feld.classList.add(stimmt ? "ist-richtig" : "ist-falsch");
    auswerten(f, stimmt, feld.value.trim());
  }
  feld.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); pruefen(); }
  });
  feld.focus();
}

/* Tippfehler sollen nicht ueber die Punktzahl entscheiden: verglichen wird
   nach der Umlautfaltung, und ein Buchstabe daneben zaehlt noch, ab acht
   Zeichen zwei. »Sambucus nigre« ist gewusst, »Salbei« nicht. */
function trifft(eingabe, loesung){
  var a = flach(eingabe).replace(/\s+/g," ").trim();
  var b = flach(loesung).replace(/\s+/g," ").trim();
  if(!a) return false;
  if(a === b) return true;
  return abstand(a,b) <= (b.length >= 8 ? 2 : 1);
}
function abstand(a,b){
  var vor = [], jetzt = [];
  for(var j=0;j<=b.length;j++) vor[j] = j;
  for(var i=1;i<=a.length;i++){
    jetzt = [i];
    for(var k=1;k<=b.length;k++){
      jetzt[k] = Math.min(
        vor[k] + 1,
        jetzt[k-1] + 1,
        vor[k-1] + (a.charAt(i-1) === b.charAt(k-1) ? 0 : 1));
    }
    vor = jetzt;
  }
  return vor[b.length];
}

function auswerten(f, stimmt, gegeben){
  var d = durchgang;
  var gewinn = 0;
  if(stimmt){
    d.serie++;
    /* Der Serienbonus waechst mit, aber nicht endlos — sonst entscheidet eine
       einzige gute Strecke den ganzen Durchgang. */
    gewinn = STUFEN[d.stufe].punkte + Math.min(d.serie - 1, 5) * 5;
    d.punkte += gewinn;
    d.beste++;
  }else{
    d.serie = 0;
  }
  d.blatt.push({ frage:f, stimmt:stimmt, gegeben:gegeben });

  var urteil = el("div","urteil");
  var spruch = el("p","spruch " + (stimmt ? "gut" : "schlecht"),
    stimmt ? "Richtig · +" + gewinn + " Punkte" : "Daneben");
  urteil.appendChild(spruch);

  var loesung = el("p","loesung");
  if(!stimmt){
    loesung.appendChild(document.createTextNode("Richtig wäre: "));
    loesung.appendChild(el("b",null,f.richtig));
    loesung.appendChild(document.createTextNode(". "));
  }
  /* Nach der Antwort steht da, worum es ging — sonst lernt man beim Pruefen
     nichts, sondern erfaehrt nur, dass man es nicht wusste. Was die Loesung
     schon gesagt hat, faellt raus: »Richtig wäre: Viburnum lantana. Viburnum
     lantana · Wolliger Schneeball« liest sich wie ein Fehler. */
  loesung.appendChild(document.createTextNode(
    [f.karte.lat, f.karte.de, f.karte.untertitel]
      .filter(function(teil){ return teil && flach(teil) !== flach(f.richtig); })
      .join(" · ")));
  urteil.appendChild(loesung);
  buehne.appendChild(urteil);

  var reihe = el("div","knopfreihe weiterzeile");
  var weiter = knopf("knopf knopf-haupt",
    d.nr + 1 >= d.fragen.length ? "Ergebnis" : "Weiter",
    function(){
      d.nr++;
      buehne.innerHTML = "";
      if(d.nr >= d.fragen.length) ergebnis(); else frageZeigen();
      window.scrollTo(0,0);
    });
  reihe.appendChild(weiter);
  buehne.appendChild(reihe);
  weiter.focus();
}

function ergebnis(){
  var d = durchgang;
  var beste = bestwerte.lesen();
  var rekord = d.punkte > (beste[d.stufe] || 0);
  if(rekord){ beste[d.stufe] = d.punkte; bestwerte.schreiben(beste); }

  var s = el("section","ergebnis");
  s.appendChild(el("p","punktzahl",String(d.punkte)));
  s.appendChild(el("p","quote", d.beste + " von " + d.fragen.length + " richtig · Stufe " +
    STUFEN[d.stufe].name));
  s.appendChild(rekord
    ? el("p","bestwert rekord","Neuer Bestwert")
    : el("p","bestwert","Bestwert auf dieser Stufe: " + (beste[d.stufe] || 0)));

  var reihe = el("div","knopfreihe");
  reihe.appendChild(knopf("knopf knopf-haupt","Nochmal", function(){
    durchgang = null; zeichne(); window.scrollTo(0,0);
  }));
  reihe.appendChild(knopf("knopf","Andere Stufe", function(){
    durchgang = null; gehe("pruefung");
  }));
  s.appendChild(reihe);

  /* Der Rueckblick ist der eigentliche Ertrag: welche Karte hat gefehlt.
     Ein Klick fuehrt auf sie. */
  var rueckblick = el("div","rueckblick");
  d.blatt.forEach(function(e){
    var zeile = el("div","zeile");
    zeile.appendChild(el("span","zeichen " + (e.stimmt ? "gut" : "schlecht"),
      e.stimmt ? "✓" : "✗"));
    var wort = el("span","wort");
    wort.appendChild(verweis(null, e.frage.karte.lat, (function(k){
      return function(){ durchgang = null; gehe("karte/" + k.id); };
    })(e.frage.karte)));
    /* War die gesuchte Antwort der Kartenname selbst, stuende hier zweimal
       dasselbe. Dann ist die eigene Fehlantwort das Interessante. */
    if(!e.stimmt){
      var nachsatz = flach(e.frage.richtig) === flach(e.frage.karte.lat)
        ? " — geantwortet: " + (e.gegeben || "nichts")
        : " — richtig war: " + e.frage.richtig;
      wort.appendChild(document.createTextNode(nachsatz));
    }
    zeile.appendChild(wort);
    rueckblick.appendChild(zeile);
  });
  s.appendChild(rueckblick);

  buehne.appendChild(s);
}

/* Erst das Bildlager, dann der erste Strich: der Rest der App zeichnet
   synchron, und ein Bild, das nach dem Zeichnen eintrifft, muesste ueberall
   nachgereicht werden. Faellt das Lager aus, wird trotzdem gezeichnet — dann
   eben ohne Aufnahmen. */
bilderLaden().then(zeichne, zeichne);

})();
</script>
